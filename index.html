<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UID Check</title>
</head>

<body>

<script>

async function checkUID(){

const params = new URLSearchParams(window.location.search);
const uid = params.get("uid");

if(!uid){
document.body.innerText="false";
return;
}

try{

const res = await fetch("uids.json?nocache=" + Date.now());
const list = await res.json();

if(list.includes(uid)){
document.body.innerText="true";
}else{
document.body.innerText="false";
}

}catch(e){

document.body.innerText="false";

}

}

checkUID();

</script>

</body>
</html>
